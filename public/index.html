<!doctype html>
<html lang="en">
  <head>
    <!-- Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Code RAGG Assistant - Ask questions about documentation or codebase"
    />

    <title>Code RAGG Assistant</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="container">
      <header>
        <h1>Code RAGG Assistant</h1>
        <h2><em>Code Retrieval Augmented (Graph) Generation</h2>
        <p class="description">
          Ask a question about the application documentation or codebase.
        </p>
      </header>

      <section>
        <label for="source">Knowledge Source</label>
        <select id="source" aria-label="Select knowledge source">
          <option value="documentation">Documentation</option>
          <option value="code">Codebase</option>
        </select>
      </section>

      <section>
        <textarea
          id="question"
          placeholder="For example: How do I configure the database?"
          aria-label="Question input"
        ></textarea>
      </section>

      <button id="askButton" type="button">Ask Question</button>

      <section
        id="status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></section>

      <section id="answer" role="region" aria-label="Answer"></section>

      <section id="sources" role="region" aria-label="Sources"></section>
    </main>

    <!-- Scripts -->
    <script src="script.js" defer></script>
  </body>
</html>
